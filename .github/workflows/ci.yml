name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-sanitizers:
    name: reka_core tests (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DREKA_BUILD_APP=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }}${{ matrix.sanitizer == 'address' && ',undefined' || '' }} -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  app-linux:
    name: REKA app + plugin hosting (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DREKA_BUILD_INTEGRATION_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Unit + plugin-hosting integration tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Smoke test (start, load starter profile, run, shut down)
        run: xvfb-run -a ./build/src/app/REKA_artefacts/Release/REKA --smoke-test 5

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DREKA_WARNINGS_AS_ERRORS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/src/app/REKA_artefacts/Release/REKA.exe dist/
          Copy-Item build/src/app/REKA_artefacts/Release/REKA-PluginHost.exe dist/
          Copy-Item README.md dist/
          Copy-Item -Recurse docs dist/docs
      - uses: actions/upload-artifact@v4
        with:
          name: REKA-windows-x64
          path: dist

  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build Pro Micro, Teensy 4.1, ESP32
        run: pio run -d firmware
