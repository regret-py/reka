# Construit « REKA.exe » sur une machine Windows de GitHub, après les tests.
#
# - Branche principale (la branche par défaut du dépôt) : l'exe est publié dans
#   l'UNIQUE release du dépôt, « build-latest », puis les anciennes releases de
#   build sont supprimées.
# - Autres branches : tests + exe en artefact du run (onglet Actions), sans release.
#
# Mises à jour automatiques — à ne pas casser :
#   chaque REKA.exe lit https://github.com/<dépôt>/releases/download/build-latest/version.json
#   et s'y met à jour si le numéro de build en ligne est plus grand que le sien.
#   Ce numéro est le numéro de run de CE workflow : ne renomme pas ce fichier
#   (le compteur repartirait à 1 et aucun REKA installé ne verrait plus les
#   nouveaux builds), ne supprime pas la release « build-latest », et ne crée
#   jamais de dépôt sous un ancien nom (regret-py/rekav2) : les exe d'avant le
#   renommage en « reka » passent par la redirection de GitHub.
name: Build Windows

on:
  push:
    branches: ["**"]      # pas les tags (dont build-latest, déplacé à chaque publication)
    paths:
      - "reaper_mixer/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

# Un nouveau push annule le build en cours de la même branche, sauf sur la
# branche principale : une publication n'est jamais coupée en plein milieu
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  tests-linux:
    name: Tests (Linux, pont Lua inclus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reaper_mixer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances système (Qt hors écran, Lua 5.4)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dépendances Python
        run: python -m pip install -r requirements.txt pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  build-windows:
    name: Tests + build de l'exe (Windows)
    needs: tests-linux
    runs-on: windows-latest
    defaults:
      run:
        working-directory: reaper_mixer
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      # Publication uniquement depuis la branche principale
      PUBLISH: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances Python
        run: python -m pip install -r requirements.txt pytest
      - name: Tests (dont masquage de fenêtres Win32)
        run: python -m pytest -q tests
      - name: Infos du build (mises à jour automatiques)
        run: |
          python - <<'PY'
          import json, os, re
          source = open("core/config.py", encoding="utf-8").read()
          version = re.search(r'^APP_VERSION = "([^"]+)"', source, re.M).group(1)
          # Canal unique « build-latest » : c'est là que tout REKA.exe cherche ses mises à jour
          info = {"version": version, "build": int(os.environ["GITHUB_RUN_NUMBER"]),
                  "commit": os.environ["GITHUB_SHA"], "repo": os.environ["GITHUB_REPOSITORY"],
                  "tag": "build-latest"}
          json.dump(info, open("build_info.json", "w", encoding="utf-8"), indent=2)
          print(info)
          PY
      - name: Build PyInstaller
        run: python -m PyInstaller --noconfirm --clean build.spec
      - name: Propriétés de l'exe (version, développeurs)
        shell: pwsh
        run: |
          $info = (Get-Item dist/REKA.exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileDescription, CompanyName, LegalCopyright
          if ($info.CompanyName -ne "Regrettable et Zerka") { throw "Crédits absents de REKA.exe" }
      - name: Auto-test de l'exe (rendu de la console en mode démo)
        env:
          APPDATA: ${{ runner.temp }}/appdata
        run: |
          mkdir -p selftest
          "./dist/REKA.exe" --selftest "$(pwd -W)/selftest/console.png"
          cat selftest/console.txt
          grep -q "RÉSULTAT : OK" selftest/console.txt
          ls -la dist selftest
      - name: Description de la mise à jour (version.json)
        env:
          PYTHONUTF8: "1"       # notes (accents, symboles) en UTF-8, pas en cp1252
        run: |
          python - <<'PY'
          import datetime, hashlib, json, subprocess
          info = json.load(open("build_info.json", encoding="utf-8"))
          data = open("dist/REKA.exe", "rb").read()
          # Nouveautés : titre du commit, ou de la pull request pour un merge
          message = subprocess.check_output(["git", "log", "-1", "--format=%B"],
                                            encoding="utf-8").strip()   # git écrit en UTF-8
          lines = [line.strip() for line in message.splitlines() if line.strip()]
          notes = lines[0] if lines else ""
          if notes.startswith("Merge pull request") and len(lines) > 1:
              notes = lines[1]
          info.update(
              sha256=hashlib.sha256(data).hexdigest(), size=len(data), notes=notes,
              published=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              url=f"https://github.com/{info['repo']}/releases/download/{info['tag']}/REKA.exe")
          json.dump(info, open("dist/version.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=2)
          print(json.dumps(info, ensure_ascii=False, indent=2))
          PY
      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: REKA
          path: |
            reaper_mixer/dist/REKA.exe
            reaper_mixer/dist/version.json
            reaper_mixer/selftest/
      - name: Release « build-latest » (mises à jour de tous les REKA)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          tag=build-latest
          python - <<'PY'
          import json, os
          info = json.load(open("dist/version.json", encoding="utf-8"))
          notes = f"""Dernière version de REKA (build {info['build']}, commit {os.environ['GITHUB_SHA'][:7]}).

          **Installer** : télécharge **REKA.exe** ci-dessous et lance-le. Il faut Voicemeeter
          (Potato ou Banana), et REAPER ou FL Studio pour les effets.
          Pour voir la console sans eux : `REKA.exe --demo`.

          **Mises à jour** : REKA se met à jour tout seul depuis cette release.

          Nouveautés : {info['notes']}

          REKA est développé par Regrettable et Zerka. Merci à 206 pour sa contribution.
          console.png : rendu de l'auto-test fait par ce build.
          """
          open("release_notes.md", "w", encoding="utf-8").write(notes)
          open("release_title.txt", "w", encoding="utf-8").write(
              f"REKA {info['version']} (build {info['build']})")
          PY
          title=$(cat release_title.txt)
          build=$GITHUB_RUN_NUMBER

          if gh release view "$tag" >/dev/null 2>&1; then
            # Relance d'un ancien run : un build plus récent est déjà en ligne, on le garde
            mkdir -p online
            if gh release download "$tag" -p version.json -D online --clobber 2>/dev/null; then
              online=$(python -c "import json; print(json.load(open('online/version.json', encoding='utf-8'))['build'])")
              if [ "$online" -gt "$build" ]; then
                echo "build-latest contient déjà le build $online : rien à publier"; exit 0
              fi
            fi
            # Mise à jour sur place : la release ne disparaît jamais, même si le run
            # s'arrête en route. L'exe d'abord, version.json en dernier : un REKA qui
            # lit le nouveau version.json trouve forcément le nouvel exe.
            gh release upload "$tag" dist/REKA.exe selftest/console.png --clobber
            gh release upload "$tag" dist/version.json --clobber
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$tag" --title "$title" --notes-file release_notes.md \
              --prerelease=false --latest
          else
            gh release create "$tag" dist/REKA.exe selftest/console.png dist/version.json \
              --target "$GITHUB_SHA" --title "$title" --notes-file release_notes.md --latest
          fi
      - name: Ménage — une seule release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Anciennes releases de build (build-<branche>…) et leurs tags : supprimées.
          # Seule « build-latest » reste : c'est celle que lisent les REKA installés.
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            case "$tag" in build-latest) continue ;; build-*) ;; *) continue ;; esac
            echo "Suppression de la release $tag"
            gh release delete "$tag" --yes --cleanup-tag || echo "::warning::release $tag non supprimée"
          done
          # Tags de build restés sans release
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/build-" --jq '.[].ref' | while read -r ref; do
            [ "$ref" = refs/tags/build-latest ] && continue
            echo "Suppression du tag ${ref#refs/tags/}"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/$ref" || echo "::warning::tag $ref non supprimé"
          done
