; =====================================================================================================
;  REKA control-surface firmware - PlatformIO project
;
;  The sketch lives in REKA/ so the very same folder opens in the Arduino IDE (File > Open > REKA/REKA.ino)
;  and in PlatformIO (this file). All user-tunable settings are in REKA/RekaConfig.h; the build flags below
;  only select per-board features that the Arduino IDE would select through its menus.
;
;    pio run                      build all boards
;    pio run -e promicro -t upload
;    pio device monitor -b 115200 (binary COBS frames - use the REKA app, not a terminal, to talk to it)
; =====================================================================================================

[platformio]
src_dir = REKA
default_envs = promicro, teensy41, esp32dev

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2
    adafruit/Adafruit NeoPixel

; SparkFun Pro Micro 5V/16 MHz (ATmega32U4, native USB: CDC serial + USB-MIDI)
[env:promicro]
platform = atmelavr
board = sparkfun_promicro16
lib_deps =
    ${env.lib_deps}
    arduino-libraries/MIDIUSB
build_flags =
    -DREKA_USB_MIDI=1

; Teensy 4.1 (USB type "Serial + MIDI")
[env:teensy41]
platform = teensy
board = teensy41
build_flags =
    -D USB_MIDI_SERIAL
    -DREKA_USB_MIDI=1

; ESP32 DevKit (USB-UART bridge, no native USB -> no USB-MIDI)
[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    -DREKA_USB_MIDI=0
